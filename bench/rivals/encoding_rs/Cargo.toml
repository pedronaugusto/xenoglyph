[package]
name = "xenoglyph-rival-encoding-rs"
version = "0.0.0"
edition = "2021"
publish = false

# xenoglyph's encodings against encoding_rs, by hand, never by CI:
# `cargo run --release -- digests` writes the interop digests the suite checks
# (ucd/whatwg/encoding_rs/digests.txt), `cargo run --release -- bench` times
# bench/encoding.zig's rows. See ../README.md.
[dependencies]
encoding_rs = "=0.8.42"
sha2 = "=0.10.9"

[profile.release]
lto = true
codegen-units = 1
